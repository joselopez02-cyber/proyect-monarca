<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="brand-icon" style="margin: 0 auto 20px auto; width: 56px; height: 56px; font-size: 32px; border-radius: 14px; box-shadow: 0 8px 24px rgba(245,197,24,0.4);">M</div>
    <h2 class="mb-1" style="font-size: 30px; letter-spacing: 2px;">CINEMA MONARCA</h2>
    <p class="text-muted mb-3" style="font-size: 11px; letter-spacing: 3px; margin-bottom: 32px;">CALI · SISTEMA DE GESTIÓN</p>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login', this)">Iniciar Sesión</button>
      <button class="auth-tab" onclick="switchAuthTab('register', this)">Registrarse</button>
    </div>

    <form id="loginForm" class="auth-form active">
      <div class="input-group" style="text-align:left">
        <label>Usuario</label>
        <input type="text" id="l_user" placeholder="Usuario" required="">
      </div>
      <div class="input-group" style="text-align:left">
        <label>Contraseña</label>
        <input type="password" id="l_pass" placeholder="••••••••" required="">
      </div>
      <button type="submit" class="btn btn-primary w-full" style="padding:12px;margin-top:8px;font-size:14px"> Iniciar Sesión
      </button>

    </form>

    <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)" style="max-height:420px;overflow-y:auto;padding-right:4px">
      <div class="input-group" style="text-align:left"><label>Usuario *</label><input type="text" id="r_username" placeholder="Ej: juan_garcia" required=""></div>
      <div class="input-group" style="text-align:left"><label>Nombre completo *</label><input type="text" id="r_nombreCompleto" placeholder="Juan García Pérez" required=""></div>
      <div class="input-group" style="text-align:left"><label>Email *</label><input type="email" id="r_email" placeholder="correo@ejemplo.com" required=""></div>
      <div class="input-group" style="text-align:left"><label>Cédula *</label><input type="text" id="r_cedula" placeholder="Ej: 1144024680" required=""></div>
      <div class="input-group" style="text-align:left"><label>Teléfono</label><input type="text" id="r_telefono" placeholder="3001234567"></div>
      <div class="input-group" style="text-align:left"><label>Dirección</label><input type="text" id="r_direccion" placeholder="Cra 5 # 10-20, Cali"></div>
      <div class="input-group" style="text-align:left"><label>Fecha de nacimiento</label><input type="date" id="r_fechaNac"></div>
      <div class="input-group" style="text-align:left"><label>Contraseña *</label><input type="password" id="r_password" placeholder="Mínimo 6 caracteres" required="" minlength="6"></div>
      <div class="input-group" style="text-align:left"><label>Confirmar contraseña *</label><input type="password" id="r_password2" placeholder="Repite la contraseña" required=""></div>
      <button type="submit" class="btn btn-primary w-full" style="padding:12px;margin-top:8px;font-size:14px">Crear Cuenta</button>
      <p id="registerError" style="font-size:12px;color:var(--c-red);margin-top:10px;display:none"></p>
    </form>
  </div>
</div>
